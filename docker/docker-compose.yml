services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: SentinelPass123!
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_user -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: sentinel-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ../backend:/app
      - ../ai_engine:/app/ai_engine
      - ../detection_engine:/app/detection_engine
      - ../remediation:/app/remediation
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel_user:SentinelPass123!@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=local
      - LOCAL_LLM_BASE_URL=http://ollama:11434/v1
      - MODEL_TRIAGE_SEVERITY=phi4-mini
      - MODEL_FORENSICS_MITIGATION=qwen2.5-coder:3b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  celery_worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: sentinel-celery
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ../backend:/app
      - ../ai_engine:/app/ai_engine
      - ../detection_engine:/app/detection_engine
      - ../remediation:/app/remediation
    environment:
      - DATABASE_URL=postgresql://sentinel_user:SentinelPass123!@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=local
      - LOCAL_LLM_BASE_URL=http://ollama:11434/v1
      - MODEL_TRIAGE_SEVERITY=phi4-mini
      - MODEL_FORENSICS_MITIGATION=qwen2.5-coder:3b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: sentinel-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull-models:
    image: curlimages/curl:latest
    container_name: sentinel-ollama-pull-models
    depends_on:
      - ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      echo 'Waiting for Ollama to start...' &&
      until curl -s http://ollama:11434/api/tags > /dev/null; do
        sleep 5
      done &&
      echo 'Ollama is up. Pulling model: phi4-mini...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"phi4-mini\"}' &&
      echo 'Pulling model: qwen2.5-coder:3b...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5-coder:3b\"}' &&
      echo 'Models successfully pulled!'
      "

volumes:
  postgres_data:
  ollama_data:

